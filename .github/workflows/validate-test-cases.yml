name: Validate Test Cases

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate all JSON test cases
        run: |
          echo "🔍 Запуск валидации всех JSON тест-кейсов..."
          FAILED=0
          for file in examples/*.json draft/*.json; do
            if [ -f "$file" ]; then
              echo "Проверка: $file"
              if ! python3 scripts/validate_tc.py "$file"; then
                FAILED=1
              fi
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "❌ Найдены невалидные тест-кейсы!"
            exit 1
          else
            echo "✅ Все тест-кейсы валидны!"
          fi
      
      - name: Validate schema file
        run: |
          echo "🔍 Проверка схемы..."
          python3 -c "import json; json.load(open('schemas/test-case.schema.json'))"
          echo "✅ Схема валидна"